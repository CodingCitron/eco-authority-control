<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
    <h1 class="h2 fw-bold">구축현황</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group me-2">
            <button type="button" class="btn btn-sm btn-outline-secondary"><i class="bi bi-printer me-1" aria-hidden="true"></i>출력</button>
        </div>
    </div>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-header bg-white py-3">
        <form class="row g-2 align-items-center">
            <div class="col-auto"><label class="form-label mb-0 fw-bold text-nowrap" for="bs-authType">전거유형</label></div>
            <div class="col-auto">
                <select id="bs-authType" class="form-select form-select-sm">
                    <option>전체</option>
                    <option>개인명</option>
                    <option>단체명</option>
                    <option>지리명</option>
                    <option>주제명</option>
                </select>
            </div>
            <div class="col-auto d-flex align-items-center gap-1">
                <label class="form-label mb-0 fw-bold ms-3 text-nowrap" for="bs-regDateFrom">등록일자</label>
                <input type="date" id="bs-regDateFrom" class="form-control form-control-sm" aria-label="등록일자 시작">
                <span aria-hidden="true">~</span>
                <input type="date" class="form-control form-control-sm" aria-label="등록일자 종료">
            </div>
            <div class="col-auto d-flex align-items-center gap-1">
                <label class="form-label mb-0 fw-bold ms-3 text-nowrap" for="bs-modDateFrom">수정일자(삭제일자)</label>
                <input type="date" id="bs-modDateFrom" class="form-control form-control-sm" aria-label="수정일자 시작">
                <span aria-hidden="true">~</span>
                <input type="date" class="form-control form-control-sm" aria-label="수정일자 종료">
            </div>
            <div class="col-auto d-flex align-items-center gap-1">
                <label class="form-label mb-0 fw-bold ms-3 text-nowrap" for="bs-editor">수정자</label>
                <input type="text" id="bs-editor" class="form-control form-control-sm" placeholder="수정자 입력">
            </div>
            <div class="col-auto ms-auto">
                <button type="button" class="btn btn-primary btn-sm">조회</button>
                <button type="button" class="btn btn-secondary btn-sm">초기화</button>
            </div>
        </form>
    </div>

    <div class="card-body">
        <table class="table table-bordered text-center align-middle">
            <caption class="visually-hidden">구축현황표</caption>
            <thead class="table-light">
                <tr>
                    <th scope="col">전거유형</th>
                    <th scope="col">구축 건수</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>개인명</td><td>25,000 건</td></tr>
                <tr><td>단체명</td><td>32,000 건</td></tr>
                <tr><td>지리명</td><td>1,200 건</td></tr>
                <tr><td>주제명</td><td>1,500 건</td></tr>
                <tr class="table-light">
                    <td class="fw-bold">전체</td>
                    <td class="fw-bold">59,700 건</td>
                </tr>
            </tbody>
        </table>
    </div>

        </div>
